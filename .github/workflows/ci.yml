name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e ./sdk
      - run: python -m pytest --cov=app.services.evaluation --cov=app.services.statistics --cov-report=term-missing
        working-directory: backend
      - run: python -m pytest
        working-directory: sdk
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy backend/app/services/evaluation.py backend/app/services/statistics.py sdk/src/parakh_sdk --ignore-missing-imports
