services:
  db:
    image: postgres:16.8
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parakh}
      POSTGRES_USER: ${POSTGRES_USER:-parakh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-parakh}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-parakh}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8000"]}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "worker.main"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-parakh}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-parakh}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  demo:
    build:
      context: .
      dockerfile: demo_app/Dockerfile
    environment:
      PARAKH_BASE_URL: http://api:8000
      PARAKH_SDK_KEY: ${PARAKH_SDK_KEY:-}
    ports:
      - "8001:8001"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
