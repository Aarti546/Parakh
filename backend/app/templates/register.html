{% extends "base.html" %}
{% block title %}Create account · Parakh{% endblock %}
{% block content %}
<section class="auth-card">
  <p class="eyebrow">GET STARTED</p>
  <h1>Create your account</h1>
  {% if error %}<p class="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/register" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Email<input type="email" name="email" autocomplete="email" required></label>
    <label>Password<input type="password" name="password" minlength="8" maxlength="128" autocomplete="new-password" required></label>
    <button class="button primary" type="submit">Create account</button>
  </form>
  <p class="muted">Already registered? <a href="/login">Log in</a></p>
</section>
{% endblock %}
