services:
  - type: web
    name: parakh-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parakh-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: parakh-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false
    plan: starter

  - type: worker
    name: parakh-events
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: python -m worker.main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parakh-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: parakh-redis
          property: connectionString
      - key: JWT_SECRET
        fromService:
          type: web
          name: parakh-api
          envVarKey: JWT_SECRET
    plan: starter

  - type: keyvalue
    name: parakh-redis
    plan: starter
    ipAllowList: []

databases:
  - name: parakh-postgres
    plan: basic-256mb
    databaseName: parakh
    user: parakh

